<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times | Chair Islamic TV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <img src="logo.png" class="logo-header" alt="Logo">
            <h1 style="margin:0">Prayer Times</h1>
        </div>
        
        <p id="location" class="page-header">Loading Kampala times...</p>
        <div class="date" id="date">-- | --</div>

        <div id="prayerBox" class="prayer-box">
            Loading schedule...
        </div>

        <div id="countdown">
            Next prayer in: --:--:--
        </div>

        <div class="btn-group" style="margin-top: 20px; text-align: center;">
            <button class="btn-outline" onclick="testAdhan()">🔊 Test Adhan Sound</button>
            <button class="btn-outline" id="stopAdhanBtn" onclick="stopAdhan()" style="display:none; background:#8b0000; border-color:#ff4d4d; color:white; margin-top:10px;">⏹ Stop Adhan</button>
        </div>
    </div>

    <!-- Adhan Audio Source -->
    <audio id="adhanAudio" preload="auto">
        <source src="blog/adthan.mp3" type="audio/mpeg">
    </audio>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html"><span>🏠</span>Home</a>
        <a href="quran.html"><span>📖</span>Quran</a>
        <a href="hadith.html"><span>📜</span>Hadith</a>
        <a href="prayer.html" class="active"><span>🕌</span>Prayer</a>
        <a href="videos.html"><span>🎥</span>Videos</a>
    </div>

    <!-- Script File Link -->
    <script src="script.js"></script>
</body>
</html>
